<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AQ MONEY - Ví, Khảo sát & Trợ lý AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #273549;
      --primary: #38bdf8;
      --accent: #22d3ee;
      --income: #22c55e;
      --expense: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      padding: 18px;
      border-radius: 16px;
      text-align: center;
    }

    .brand { font-weight: 800; letter-spacing: 1px; font-size: 0.88rem; opacity: 0.9; }
    header h1 { font-size: 1.05rem; font-weight: 500; margin: 4px 0 10px; }
    .balance-label { font-size: 0.82rem; opacity: 0.85; }
    .balance-amount { font-size: 1.9rem; font-weight: 800; margin-top: 2px; }

    /* 3 TABS */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .tab-btn {
      padding: 9px 6px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease, color 0.2s ease;
      will-change: transform;
    }

    .tab-btn:active { transform: scale(0.96); }
    .tab-btn.active { background: var(--primary); color: #0f172a; }

    .view-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      animation: fadeUp 0.18s ease-out;
      will-change: transform, opacity;
    }

    .view-panel.active { display: flex; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary-card, .card {
      background: var(--surface);
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .summary-card span { font-size: 0.82rem; color: var(--muted); }
    .summary-card h3 { font-size: 1.1rem; margin-top: 4px; }
    .income-text { color: var(--income); }
    .expense-text { color: var(--expense); }

    .card h3 {
      font-size: 0.98rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 9px; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.14s ease;
      will-change: transform;
    }

    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-light);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tx-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
      border-left: 4px solid var(--income);
    }
    .tx-item.expense { border-left-color: var(--expense); }
    .tx-title { font-size: 0.9rem; font-weight: 600; }
    .tx-date { font-size: 0.74rem; color: var(--muted); }
    .tx-right { display: flex; align-items: center; gap: 8px; }
    .tx-amount { font-weight: 700; font-size: 0.9rem; }
    .del-btn { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }

    /* SURVEY */
    .survey-item {
      background: var(--bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .survey-item:last-child { margin-bottom: 0; }
    .reward-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--income);
      font-weight: 700;
      font-size: 0.78rem;
    }
    .start-survey-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .start-survey-btn.done { background: var(--surface-light); color: var(--muted); cursor: default; }

    .progress-bar { width: 100%; height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s ease; }
    .question-text { font-size: 0.98rem; font-weight: 600; margin-bottom: 10px; }
    .options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .option-btn {
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .option-btn.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); font-weight: 600; }

    /* AI TAB */
    .ai-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .ai-row { display: flex; gap: 8px; }
    .ai-box {
      height: 260px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    .msg {
      max-width: 86%;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      white-space: pre-wrap;
      animation: fadeUp 0.15s ease-out;
      will-change: transform, opacity;
    }
    .msg.user { align-self: flex-end; background: #0284c7; color: #fff; }
    .msg.ai { align-self: flex-start; background: var(--surface-light); border: 1px solid var(--border); }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translate(-50%, 70px);
      background: var(--income);
      color: #052e16;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.88rem;
      opacity: 0;
      transition: transform 0.22s ease, opacity 0.22s ease;
      pointer-events: none;
      z-index: 99;
      will-change: transform, opacity;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .empty-state { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 14px 0; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">AQ MONEY</div>
      <h1>Ví • Khảo sát • Trợ lý AI</h1>
      <div class="balance-label">Tổng số dư của bạn</div>
      <div class="balance-amount" id="totalBalance">0 đ</div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="walletView">Ví tiền</button>
      <button class="tab-btn" data-tab="surveyView">Khảo sát</button>
      <button class="tab-btn" data-tab="aiView">Trợ lý AI</button>
    </nav>

    <!-- TAB 1: VÍ -->
    <section id="walletView" class="view-panel active">
      <div class="summary-grid">
        <div class="summary-card">
          <span>Thu nhập</span>
          <h3 class="income-text" id="totalIncome">0 đ</h3>
        </div>
        <div class="summary-card">
          <span>Chi tiêu</span>
          <h3 class="expense-text" id="totalExpense">0 đ</h3>
        </div>
      </div>

      <div class="card">
        <h3>Thêm giao dịch</h3>
        <form id="txForm" class="form-group">
          <select id="txType">
            <option value="income">Thu nhập (+)</option>
            <option value="expense">Chi tiêu (-)</option>
          </select>
          <input type="text" id="txDesc" placeholder="Nội dung (vd: Tiền ăn, Lương...)" required />
          <input type="number" id="txAmount" placeholder="Số tiền (VNĐ)" min="1000" step="500" required />
          <button type="submit" class="btn-primary">Lưu giao dịch</button>
        </form>
      </div>

      <div class="card">
        <h3>
          <span>Lịch sử giao dịch</span>
          <button type="button" class="btn-secondary" id="clearAllTxBtn">Xóa tất cả</button>
        </h3>
        <div class="tx-list" id="txList"></div>
      </div>
    </section>

    <!-- TAB 2: KHẢO SÁT -->
    <section id="surveyView" class="view-panel">
      <div class="card" id="surveyListCard">
        <h3>
          <span>Khảo sát nhận thưởng</span>
          <button type="button" class="btn-secondary" id="resetSurveysBtn">Làm lại</button>
        </h3>
        <div id="surveyListContainer"></div>
      </div>

      <div class="card" id="surveyPlayerCard" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span id="surveyStepText" style="font-size:0.84rem; color:var(--primary); font-weight:700;">Câu 1/2</span>
          <button type="button" class="btn-secondary" id="cancelSurveyBtn">Thoát</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="surveyProgress"></div></div>
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <button type="button" class="btn-primary" id="nextQuestionBtn">Tiếp theo</button>
      </div>
    </section>

    <!-- TAB 3: TRỢ LÝ AI -->
    <section id="aiView" class="view-panel">
      <div class="card">
        <div class="ai-controls">
          <div class="ai-row">
            <select id="aiMode">
              <option value="finance">Cố vấn Tài chính</option>
              <option value="dev">Hỗ trợ Code Web</option>
              <option value="fun">Đố vui & Thử thách</option>
            </select>
            <button type="button" class="btn-secondary" id="clearAiBtn">Xóa chat</button>
          </div>
          <div class="ai-row">
            <input type="password" id="geminiKeyInput" placeholder="Gemini API Key (tùy chọn)" />
            <button type="button" class="btn-secondary" id="saveGeminiKeyBtn">Lưu</button>
          </div>
        </div>

        <div class="ai-box" id="aiChatBox"></div>

        <form id="aiForm" class="ai-row">
          <input type="text" id="aiPromptInput" placeholder="Hỏi AI hoặc yêu cầu viết code/câu đố..." required />
          <button type="submit" class="btn-primary" style="width:auto; padding:0 16px;" id="aiSendBtn">Gửi</button>
        </form>
      </div>
    </section>
  </div>

  <div class="toast" id="toastBox"></div>

  <script>
    const SURVEY_DATA = [
      {
        id: "sv_budget_1",
        title: "Khảo sát thói quen chi tiêu",
        desc: "2 câu hỏi • Thưởng ngay",
        reward: 15000,
        questions: [
          { q: "Bạn chi nhiều tiền nhất cho khoản nào?", options: ["Ăn uống", "Di chuyển", "Mua sắm", "Giải trí"] },
          { q: "Bạn muốn theo dõi thu chi theo chu kỳ nào?", options: ["Hàng ngày", "Hàng tuần", "Hàng tháng"] }
        ]
      },
      {
        id: "sv_ui_2",
        title: "Khảo sát trải nghiệm giao diện",
        desc: "2 câu hỏi • Thưởng ngay",
        reward: 10000,
        questions: [
          { q: "Giao diện tối (Dark Mode) có dễ nhìn trên máy bạn không?", options: ["Rất dễ nhìn", "Bình thường", "Cần chỉnh thêm"] },
          { q: "Bạn thích dùng tab nào nhất trong AQ Money?", options: ["Ví tiền", "Khảo sát", "Trợ lý AI"] }
        ]
      }
    ];

    const KEYS = {
      TX: "aq_money_tx_v2",
      DONE_SV: "aq_money_done_sv_v2",
      GEMINI_KEY: "aq_money_gemini_key_v2"
    };

    let transactions = JSON.parse(localStorage.getItem(KEYS.TX)) || [];
    let completedSurveys = JSON.parse(localStorage.getItem(KEYS.DONE_SV)) || [];

    function formatVND(n) { return Number(n).toLocaleString("vi-VN") + " đ"; }

    function showToast(msg) {
      const el = document.getElementById("toastBox");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2400);
    }

    function renderWallet() {
      let inc = 0, exp = 0;
      transactions.forEach(t => t.type === "income" ? inc += t.amount : exp += t.amount);
      document.getElementById("totalBalance").textContent = formatVND(inc - exp);
      document.getElementById("totalIncome").textContent = formatVND(inc);
      document.getElementById("totalExpense").textContent = formatVND(exp);

      const list = document.getElementById("txList");
      list.innerHTML = "";
      if (!transactions.length) {
        list.innerHTML = `<div class="empty-state">Chưa có giao dịch nào.</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      transactions.forEach(t => {
        const div = document.createElement("div");
        div.className = `tx-item ${t.type}`;
        div.innerHTML = `
          <div>
            <div class="tx-title">${t.desc}</div>
            <div class="tx-date">${t.date}</div>
          </div>
          <div class="tx-right">
            <span class="tx-amount ${t.type === "income" ? "income-text" : "expense-text"}">
              ${t.type === "income" ? "+" : "-"}${formatVND(t.amount)}
            </span>
            <button class="del-btn" data-id="${t.id}" title="Xóa">&times;</button>
          </div>
        `;
        frag.appendChild(div);
      });
      list.appendChild(frag);
    }

    function addTx(type, desc, amount) {
      const now = new Date();
      transactions.unshift({
        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
        type,
        desc,
        amount: Number(amount),
        date: `${now.toLocaleDateString("vi-VN")} ${now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}`
      });
      localStorage.setItem(KEYS.TX, JSON.stringify(transactions));
      renderWallet();
    }

    document.getElementById("txForm").addEventListener("submit", e => {
      e.preventDefault();
      const type = document.getElementById("txType").value;
      const desc = document.getElementById("txDesc").value.trim();
      const amount = Number(document.getElementById("txAmount").value);
      if (!desc || amount <= 0) return;
      addTx(type, desc, amount);
      e.target.reset();
      showToast("Đã lưu giao dịch!");
    });

    document.getElementById("txList").addEventListener("click", e => {
      if (e.target.classList.contains("del-btn")) {
        const id = e.target.getAttribute("data-id");
        transactions = transactions.filter(t => t.id !== id);
        localStorage.setItem(KEYS.TX, JSON.stringify(transactions));
        renderWallet();
      }
    });

    document.getElementById("clearAllTxBtn").addEventListener("click", () => {
      transactions = [];
      localStorage.setItem(KEYS.TX, JSON.stringify(transactions));
      renderWallet();
      showToast("Đã xóa lịch sử!");
    });

    // SURVEY
    let activeSv = null, qIdx = 0, picked = null;

    function renderSurveys() {
      const box = document.getElementById("surveyListContainer");
      box.innerHTML = "";
      const frag = document.createDocumentFragment();
      SURVEY_DATA.forEach(sv => {
        const done = completedSurveys.includes(sv.id);
        const item = document.createElement("div");
        item.className = "survey-item";
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:0.92rem;">${sv.title}</div>
            <div style="font-size:0.78rem; color:var(--muted);">${sv.desc}</div>
            <span class="reward-badge">+${formatVND(sv.reward)}</span>
          </div>
          <button class="start-survey-btn ${done ? "done" : ""}" data-id="${sv.id}" ${done ? "disabled" : ""}>
            ${done ? "Đã nhận" : "Làm ngay"}
          </button>
        `;
        frag.appendChild(item);
      });
      box.appendChild(frag);
    }

    function showQuestion() {
      const qObj = activeSv.questions[qIdx];
      picked = null;
      document.getElementById("surveyStepText").textContent = `Câu ${qIdx + 1}/${activeSv.questions.length}`;
      document.getElementById("surveyProgress").style.width = `${(qIdx / activeSv.questions.length) * 100}%`;
      document.getElementById("questionText").textContent = qObj.q;

      const optList = document.getElementById("optionsList");
      optList.innerHTML = "";
      qObj.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          picked = i;
        });
        optList.appendChild(btn);
      });

      document.getElementById("nextQuestionBtn").textContent =
        qIdx === activeSv.questions.length - 1 ? `Hoàn thành (+${formatVND(activeSv.reward)})` : "Câu tiếp theo";
    }

    document.getElementById("surveyListContainer").addEventListener("click", e => {
      if (e.target.classList.contains("start-survey-btn") && !e.target.disabled) {
        activeSv = SURVEY_DATA.find(s => s.id === e.target.getAttribute("data-id"));
        qIdx = 0;
        document.getElementById("surveyListCard").style.display = "none";
        document.getElementById("surveyPlayerCard").style.display = "block";
        showQuestion();
      }
    });

    document.getElementById("nextQuestionBtn").addEventListener("click", () => {
      if (picked === null) return showToast("Hãy chọn 1 đáp án!");
      qIdx++;
      if (qIdx < activeSv.questions.length) {
        showQuestion();
      } else {
        if (!completedSurveys.includes(activeSv.id)) {
          completedSurveys.push(activeSv.id);
          localStorage.setItem(KEYS.DONE_SV, JSON.stringify(completedSurveys));
        }
        addTx("income", `[Survey] ${activeSv.title}`, activeSv.reward);
        document.getElementById("surveyPlayerCard").style.display = "none";
        document.getElementById("surveyListCard").style.display = "block";
        renderSurveys();
        showToast(`+${formatVND(activeSv.reward)} vào ví AQ Money!`);
      }
    });

    document.getElementById("cancelSurveyBtn").addEventListener("click", () => {
      document.getElementById("surveyPlayerCard").style.display = "none";
      document.getElementById("surveyListCard").style.display = "block";
    });

    document.getElementById("resetSurveysBtn").addEventListener("click", () => {
      completedSurveys = [];
      localStorage.setItem(KEYS.DONE_SV, JSON.stringify(comple
