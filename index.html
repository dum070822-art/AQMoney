<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AQ MONEY - Quản lý tài chính & Khảo sát nhận thưởng</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #273549;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --income: #22c55e;
      --expense: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 500;
      margin: 4px 0 12px;
      opacity: 0.95;
    }

    .balance-label {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .balance-amount {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 4px;
    }

    /* TABS NAVIGATION */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease, color 0.2s ease;
      will-change: transform;
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    /* VIEW PANELS */
    .view-panel {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeSlide 0.2s ease-out;
      will-change: transform, opacity;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* SUMMARY CARDS */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      background: var(--surface);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .summary-card span {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .summary-card h3 {
      font-size: 1.15rem;
      margin-top: 4px;
    }

    .income-text { color: var(--income); }
    .expense-text { color: var(--expense); }

    /* CARD BOX */
    .card {
      background: var(--surface);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* FORM INPUTS */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      will-change: transform;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-light);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* TRANSACTION HISTORY */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
      border-left: 4px solid var(--income);
    }

    .tx-item.expense {
      border-left-color: var(--expense);
    }

    .tx-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tx-title {
      font-size: 0.92rem;
      font-weight: 600;
    }

    .tx-date {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .del-btn:hover {
      color: var(--expense);
    }

    /* SURVEY LIST & PLAYER */
    .survey-item {
      background: var(--bg);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .survey-item:last-child {
      margin-bottom: 0;
    }

    .survey-meta h4 {
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .survey-meta p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .reward-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--income);
      font-weight: 700;
      font-size: 0.8rem;
    }

    .start-survey-btn {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .start-survey-btn.done {
      background: var(--surface-light);
      color: var(--muted);
      cursor: default;
    }

    /* QUIZ / SURVEY QUESTION BOX */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--bg);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: transform 0.25s ease;
      transform-origin: left;
    }

    .question-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .option-btn {
      text-align: left;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      font-weight: 600;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 80px);
      background: var(--income);
      color: #052e16;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 99px;
      font-size: 0.9rem;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      z-index: 99;
      will-change: transform, opacity;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- HEADER -->
    <header>
      <div class="brand">AQ MONEY</div>
      <h1>Quản lý tài chính & Khảo sát</h1>
      <div class="balance-label">Tổng số dư của bạn</div>
      <div class="balance-amount" id="totalBalance">0 đ</div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="walletView">Ví của tôi</button>
      <button class="tab-btn" data-tab="surveyView">Khảo sát (+Thưởng)</button>
    </nav>

    <!-- TAB 1: VÍ AQ MONEY -->
    <section id="walletView" class="view-panel active">
      <div class="summary-grid">
        <div class="summary-card">
          <span>Thu nhập</span>
          <h3 class="income-text" id="totalIncome">0 đ</h3>
        </div>
        <div class="summary-card">
          <span>Chi tiêu</span>
          <h3 class="expense-text" id="totalExpense">0 đ</h3>
        </div>
      </div>

      <div class="card">
        <h3>Thêm giao dịch</h3>
        <form id="txForm" class="form-group">
          <select id="txType">
            <option value="income">Thu nhập (+)</option>
            <option value="expense">Chi tiêu (-)</option>
          </select>
          <input type="text" id="txDesc" placeholder="Nội dung (vd: Tiền ăn, Lương...)" required />
          <input type="number" id="txAmount" placeholder="Số tiền (VNĐ)" min="1000" step="500" required />
          <button type="submit" class="btn-primary">Lưu giao dịch</button>
        </form>
      </div>

      <div class="card">
        <h3>
          <span>Lịch sử giao dịch</span>
          <button type="button" class="btn-secondary" id="clearAllTxBtn">Xóa tất cả</button>
        </h3>
        <div class="tx-list" id="txList"></div>
      </div>
    </section>

    <!-- TAB 2: KHẢO SÁT NHẬN THƯỞNG (SURVEY) -->
    <section id="surveyView" class="view-panel">
      <!-- Danh sách khảo sát -->
      <div class="card" id="surveyListCard">
        <h3>
          <span>Khảo sát hiện có</span>
          <button type="button" class="btn-secondary" id="resetSurveysBtn">Làm lại</button>
        </h3>
        <div id="surveyListContainer"></div>
      </div>

      <!-- Màn hình trả lời câu hỏi -->
      <div class="card" id="surveyPlayerCard" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span id="surveyStepText" style="font-size:0.85rem; color:var(--primary); font-weight:700;">Câu 1/3</span>
          <button type="button" class="btn-secondary" id="cancelSurveyBtn">Thoát</button>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="surveyProgress"></div>
        </div>
        <div class="question-text" id="questionText"></div>
        <div class="options-list" id="optionsList"></div>
        <button type="button" class="btn-primary" id="nextQuestionBtn">Tiếp theo</button>
      </div>
    </section>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toastBox">+10.000 đ vào ví AQ Money!</div>

  <script>
    // ==========================================
    // 1. DỮ LIỆU KHẢO SÁT MẪU (BẠN CÓ THỂ SỬA/THÊM TẠI ĐÂY)
    // ==========================================
    const SURVEY_DATA = [
      {
        id: "sv_spending_2026",
        title: "Thói quen chi tiêu hàng ngày",
        desc: "3 câu hỏi ngắn • Mất khoảng 30 giây",
        reward: 15000,
        questions: [
          {
            q: "Khoản chi tiêu lớn nhất mỗi tuần của bạn thường rơi vào mục nào?",
            options: ["Ăn uống & Cà phê", "Đi lại & Xăng xe", "Mua sắm online", "Giải trí & Game"]
          },
          {
            q: "Bạn thường ghi chép thu chi vào thời điểm nào?",
            options: ["Ngay sau khi chi tiền", "Cuối ngày trước khi ngủ", "Cuối tuần tổng kết", "Ít khi ghi chép"]
          },
          {
            q: "Mục tiêu tiết kiệm trong tháng tới của bạn là bao nhiêu?",
            options: ["Dưới 1 triệu đồng", "Từ 1 - 3 triệu đồng", "Trên 3 triệu đồng", "Chưa có kế hoạch cụ thể"]
          }
        ]
      },
      {
        id: "sv_app_feedback",
        title: "Đánh giá trải nghiệm AQ Money",
        desc: "2 câu hỏi ngắn • Nhận thưởng ngay",
        reward: 10000,
        questions: [
          {
            q: "Bạn thích tính năng nào nhất trên ứng dụng AQ Money?",
            options: ["Giao diện gọn nhẹ, dễ dùng", "Làm khảo sát nhận tiền thưởng", "Tốc độ tải nhanh", "Lưu dữ liệu tự động"]
          },
          {
            q: "Tính năng nào bạn muốn AQ Money bổ sung tiếp theo?",
            options: ["Biểu đồ thống kê thu chi", "Đặt hạn mức chi tiêu tháng", "Xuất dữ liệu ra file Excel", "Nhiều nhiệm vụ khảo sát hơn"]
          }
        ]
      },
      {
        id: "sv_tech_habits",
        title: "Khảo sát sử dụng thiết bị di động",
        desc: "3 câu hỏi • Thưởng cao",
        reward: 25000,
        questions: [
          {
            q: "Trung bình mỗi ngày bạn dùng điện thoại bao nhiêu giờ?",
            options: ["Dưới 3 tiếng", "3 - 5 tiếng", "5 - 8 tiếng", "Trên 8 tiếng"]
          },
          {
            q: "Bạn thường dùng trình duyệt web trên điện thoại để làm gì?",
            options: ["Đọc tin tức & Tra cứu", "Chơi mini-game web", "Học tập & Làm bài tập", "Quản lý công việc / tài chính"]
          },
          {
            q: "Yếu tố nào khiến bạn thoát khỏi một trang web ngay lập tức?",
            options: ["Tải chậm, giật lag", "Quá nhiều quảng cáo che màn hình", "Giao diện khó nhìn trên điện thoại", "Yêu cầu đăng nhập rườm rà"]
          }
        ]
      }
    ];

    // ==========================================
    // 2. QUẢN LÝ TRẠNG THÁI & LOCALSTORAGE
    // ==========================================
    const STORAGE_KEYS = {
      TRANSACTIONS: "aq_money_transactions_v1",
      COMPLETED_SURVEYS: "aq_money_completed_surveys_v1",
      SURVEY_ANSWERS: "aq_money_survey_answers_v1"
    };

    let transactions = JSON.parse(localStorage.getItem(STORAGE_KEYS.TRANSACTIONS)) || [];
    let completedSurveys = JSON.parse(localStorage.getItem(STORAGE_KEYS.COMPLETED_SURVEYS)) || [];
    let savedAnswers = JSON.parse(localStorage.getItem(STORAGE_KEYS.SURVEY_ANSWERS)) || {};

    // Biến tạm khi đang làm khảo sát
    let activeSurvey = null;
    let currentQIndex = 0;
    let tempAnswers = [];
    let selectedOptionIndex = null;

    // ==========================================
    // 3. TIỆN ÍCH ĐỊNH DẠNG & THÔNG BÁO
    // ==========================================
    function formatVND(amount) {
      return Number(amount).toLocaleString("vi-VN") + " đ";
    }

    function showToast(message) {
      const toast = document.getElementById("toastBox");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function saveWalletState() {
      localStorage.setItem(STORAGE_KEYS.TRANSACTIONS, JSON.stringify(transactions));
    }

    // ==========================================
    // 4. LOGIC VÍ AQ MONEY (TÍNH TOÁN & RENDER)
    // ==========================================
    function renderWallet() {
      let income = 0;
      let expense = 0;

      transactions.forEach(tx => {
        if (tx.type === "income") income += tx.amount;
        else expense += tx.amount;
      });

      const balance = income - expense;

      document.getElementById("totalBalance").textContent = formatVND(balance);
      document.getElementById("totalIncome").textContent = formatVND(income);
      document.getElementById("totalExpense").textContent = formatVND(expense);

      const listEl = document.getElementById("txList");
      listEl.innerHTML = "";

      if (transactions.length === 0) {
        listEl.innerHTML = `<div class="empty-state">Chưa có giao dịch nào. Hãy thêm giao dịch hoặc làm khảo sát nhận thưởng!</div>`;
        return;
      }

      // Dùng DocumentFragment để render nhanh, tránh giật lag
      const frag = document.createDocumentFragment();
      transactions.forEach(tx => {
        const item = document.createElement("div");
        item.className = `tx-item ${tx.type}`;
        const sign = tx.type === "income" ? "+" : "-";
        const colorClass = tx.type === "income" ? "income-text" : "expense-text";

        item.innerHTML = `
          <div class="tx-info">
            <span class="tx-title">${tx.desc}</span>
            <span class="tx-date">${tx.date}</span>
          </div>
          <div class="tx-right">
            <span class="tx-amount ${colorClass}">${sign}${formatVND(tx.amount)}</span>
            <button class="del-btn" title="Xóa" data-id="${tx.id}">&times;</button>
          </div>
        `;
        frag.appendChild(item);
      });

      listEl.appendChild(frag);
    }

    function addTransaction(type, desc, amount) {
      const now = new Date();
      const dateStr = `${now.toLocaleDateString("vi-VN")} ${now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" })}`;

      transactions.unshift({
        id: Date.now().toString(),
        type,
        desc,
        amount: Number(amount),
        date: dateStr
      });

      saveWalletState();
      renderWallet();
    }

    // Sự kiện thêm giao dịch thủ công
    document.getElementById("txForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const type = document.getElementById("txType").value;
      const desc = document.getElementById("txDesc").value.trim();
      const amount = Number(document.getElementById("txAmount").value);

      if (!desc || amount <= 0) return;

      addTransaction(type, desc, amount);
      e.target.reset();
      showToast("Đã lưu giao dịch!");
    });

    // Sự kiện xóa từng giao dịch (Event Delegation)
    document.getElementById("txList").addEventListener("click", (e) => {
      if (e.target.classList.contains("del-btn")) {
        const id = e.target.getAttribute("data-id");
        transactions = transactions.filter(tx => tx.id !== id);
        saveWalletState();
        renderWallet();
      }
    });

    // Xóa toàn bộ lịch sử
    document.getElementById("clearAllTxBtn").addEventListener("click", () => {
      if (transactions.length === 0) return;
      transactions = [];
      saveWalletState();
      renderWallet();
      showToast("Đã xóa toàn bộ lịch sử!");
    });

    // ==========================================
    // 5. LOGIC KHẢO SÁT (SURVEY) & CỘNG THƯỞNG
    // ==========================================
    function renderSurveyList() {
      const container = document.getElementById("surveyListContainer");
      container.innerHTML = "";

      const frag = document.createDocumentFragment();
      SURVEY_DATA.forEach(sv => {
        const isDone = completedSurveys.includes(sv.id);
        const div = document.createElement("div");
        div.className = "survey-item";
        div.innerHTML = `
          <div class="survey-meta">
            <h4>${sv.title}</h4>
            <p>${sv.desc}</p>
            <span class="reward-badge">+${formatVND(sv.reward)}</span>
          </div>
          <button class="start-survey-btn ${isDone ? "done" : ""}" data-sv-id="${sv.id}" ${isDone ? "disabled" : ""}>
            ${isDone ? "Đã nhận thưởng" : "Bắt đầu"}
          </button>
        `;
        frag.appendChild(div);
      });

      container.appendChild(frag);
    }

    function startSurvey(surveyId) {
